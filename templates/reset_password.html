<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — LASU CampusMart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            <span>LASU</span>
            <h1>CampusMart</h1>
        </div>

        <h2>Create New Password</h2>
        <p>Resetting password for <strong>{{ email }}</strong></p>

        {% if error %}
        <div class="auth-errors">
            <div class="auth-error-item">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
        </div>
        {% endif %}

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required autofocus>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="auth-submit">
                <i class="fa-solid fa-check"></i> Save New Password
            </button>
        </form>

    </div>

</body>
</html>
