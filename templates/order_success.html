<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful — LASU CampusMart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body class="auth-page" style="background: #f5f5f7;">
    <div class="auth-box" style="text-align: center; max-width: 400px;">
        
        <i class="fa-solid fa-circle-check" style="font-size: 60px; color: #16a34a; margin-bottom: 20px;"></i>
        
        <h1 style="color: #111; font-size: 24px; margin-bottom: 10px;">Payment Successful!</h1>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">
            Thank you for shopping with LASU CampusMart. Your order has been placed and is being processed.
        </p>

        <div style="background: #fff; border: 1px dashed #ccc; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
            <p style="font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 5px;">Order Reference</p>
            <h2 style="color: #0b1aff; font-size: 24px; margin-bottom: 10px;">#{{ order_id }}</h2>
            <p style="font-size: 14px; color: #333;">Total Paid: <strong>₦{{ "{:,.0f}".format(total|float) }}</strong></p>
        </div>

        <a href="{{ url_for('my_orders') }}" class="place-order-btn" style="display: block; background: #0b1aff; color: #fff; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 15px;">
            <i class="fa-solid fa-box"></i> View My Orders
        </a>
        
        <a href="{{ url_for('home') }}" style="display: block; color: #666; text-decoration: none; font-size: 14px; font-weight: bold;">
            <i class="fa-solid fa-house"></i> Return to Homepage
        </a>
    </div>
</body>
</html>
